[package]
name = "driver-demo"
version = "0.1.0"
edition = "2024"

# The library (src/lib.rs, the command protocol) builds anywhere, so `cargo test-host` can run
# its tests on the PC. Only the firmware (src/main.rs) needs the board crates below.
[lib]
name = "driver_demo"
path = "src/lib.rs"

[[bin]]
name = "driver-demo"
path = "src/main.rs"
test = false
bench = false

[dependencies]
bq41z50                  = { path = "../bq41z50" }
embedded-batteries-async = "0.3.4"
embedded-hal-async       = "1.0"
heapless                 = "0.9.3"

[target.'cfg(target_os = "none")'.dependencies]
embedded-hal     = "1.0"
embassy-rp       = { version = "0.10.0", features = ["rp235xa", "time-driver", "critical-section-impl"] }
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread"] }
embassy-time     = "0.5.1"
embassy-usb      = "0.6.0"
embassy-futures  = "0.1.2"
embassy-sync     = "0.8.0"
cortex-m         = { version = "0.7.9", features = ["inline-asm"] }
# set-vtor/set-sp: start correctly even when a debugger jumps straight to Reset and skips the boot ROM
cortex-m-rt      = { version = "0.7.7", features = ["set-vtor", "set-sp"] }
panic-halt       = "1.0"

[profile.release]
debug = 2
