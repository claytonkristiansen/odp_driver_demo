[package]
name = "driver-demo"
version = "0.1.0"
edition = "2024"

[dependencies]
bq41z50                  = { path = "../bq41z50" }
embedded-batteries-async = "0.3.4"
embedded-hal-async       = "1.0"
embassy-rp       = { version = "0.3", features = ["rp235xa", "time-driver", "critical-section-impl"] }
embassy-executor = { version = "0.7", features = ["arch-cortex-m", "executor-thread"] }
embassy-time     = "0.4"
embassy-usb      = "0.4"
embassy-futures  = "0.1"
cortex-m-rt      = "0.7"
heapless         = "0.8"
panic-halt       = "1.0"

[profile.release]
debug = 2
